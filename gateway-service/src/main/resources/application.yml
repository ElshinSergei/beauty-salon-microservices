server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Сервис бронирований
        - id: booking-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/appointments/**

        # Сервис пользователей и авторизации
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**