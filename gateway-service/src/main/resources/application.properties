server.port=8080

spring.application.name=gateway-service

# 1. Публичный маршрут для входа и регистрации (User Service)
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Защищённый маршрут для управления пользователями
spring.cloud.gateway.routes[1].id=user-service-route
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# 3. Защищённый маршрут для бронирований
spring.cloud.gateway.routes[2].id=booking-service-route
spring.cloud.gateway.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/appointments/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# Настройка подключения к Eureka-серверу
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# Секретный ключ для проверки JWT (должен совпадать с ключом в user-service)
jwt.secret=9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f