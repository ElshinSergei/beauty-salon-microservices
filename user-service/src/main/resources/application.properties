spring.application.name=user-service
server.port=8081

# Настройки подключения к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=elshin_user
spring.datasource.password=secret_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Настройки Hibernate (JPA)
# update означает, что Spring Boot сам создаст таблицы в БД при запуске на основе наших Java-классов
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true